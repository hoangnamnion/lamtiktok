name: Build iOS IPA (Capacitor Native App)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Native iOS IPA
    runs-on: macos-14
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🔨 Bundle Web Assets to www/
        run: npm run build

      - name: 📱 Add & Sync Capacitor iOS Project
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: 🛠️ Build iOS App with Xcode (Unsigned / Ad-hoc)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: 📦 Package into .IPA (Payload structure)
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "App.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ Không tìm thấy thư mục App.app!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r -9 TikTokQuote.ipa Payload
          echo "🎉 Đóng gói thành công TikTokQuote.ipa"

      - name: 🚀 Upload IPA Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: TikTokQuote-iOS-IPA
          path: TikTokQuote.ipa
          retention-days: 30
